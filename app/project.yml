name: OneOneVPN
options:
  bundleIdPrefix: com.oneonevpn
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set this to your Apple Developer Team ID (or pick it in Xcode → Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
targets:
  OneOneVPN:
    type: application
    platform: iOS
    sources: [OneOneVPN]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oneonevpn.app
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: OneOneVPN/OneOneVPN.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "1.1.1.1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
          UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
